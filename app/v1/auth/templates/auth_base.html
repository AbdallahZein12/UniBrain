<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}UniBrain | Auth{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('auth.static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/auth.css') }}">
</head>
<body>

  <header class="auth-nav">
    <div class="inner">
      <a class="brand" href="{{ url_for('v1.home') }}" aria-label="UniBrain Home">
        <img src="{{ url_for('auth.static', filename='img/logo.svg') }}" alt="UniBrain">
        <span class="brand-name">UniBrain</span>
        <span class="brand-tag">Ontology-Driven Advising</span>
      </a>
      <a class="btn ghost" href="{{ url_for('v1.home') }}">← Back to Home</a>
    </div>
  </header>

  <main class="auth-shell">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        <div class="alerts">
          {% for category, message in messages %}
            <div class="alert {{ category }}">
              <span class="pill">{{ category|title }}</span>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
