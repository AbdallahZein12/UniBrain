<h1>Welcome  {% if current_user.student_profile.full_name %}
          {{ current_user.student_profile.full_name }}
        {% else %}
          {{ current_user.student_profile.email }}
        {% endif %}</h1>

<div style="margin-top: 16px;">
  <a href="{{ url_for('v1.profile_edit_get') }}">
    <button type="button">Edit Profile</button>
  </a>
</div>

<form method="POST" action="{{ url_for('v1.auth.logout_post') }}" style="margin-top: 16px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Log out</button>
</form>
