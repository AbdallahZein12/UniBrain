<div class="progress-card">
  <div class="progress-left">
    <div class="progress-title">Degree progress</div>
    <div class="progress-sub">
      Rough estimate based on your entered courses. We’ll make this fully deterministic soon.
    </div>

    <div class="progress-metrics">
      <div class="metric">
        <div class="metric-label">Credits completed</div>
        <div class="metric-value">72 / 120</div>
      </div>
      <div class="metric">
        <div class="metric-label">Requirements satisfied</div>
        <div class="metric-value">18 / 26</div>
      </div>
      <div class="metric">
        <div class="metric-label">On track</div>
        <div class="metric-value ok-text">Yes</div>
      </div>
    </div>
  </div>

  <div class="progress-right">
    <div class="progress-ring">
      <div class="ring">
        <div class="ring-inner">
          <div class="ring-big">60%</div>
          <div class="ring-small">complete</div>
        </div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="bar-track">
        <div class="bar-fill" style="width:60%"></div>
      </div>
      <div class="bar-meta">
        <span class="muted">Target graduation:</span> <span>Dec 2025</span>
      </div>
    </div>
  </div>
</div>
