<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />

    <title>{% block title %}UniBrain{% endblock %}</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="{{ url_for('v1.static', filename='allocations/img/logo.svg') }}" type="image/svg+xml">

    <style>
      :root{
        --bg0:#070B1A;
        --bg1:#0B1030;
        --card:#0E173D;
        --text:#EAF0FF;
        --muted:rgba(234,240,255,.7);
        --border:rgba(234,240,255,.12);
        --brand:#6CA7FF;
        --shadow:0 14px 40px rgba(0,0,0,.35);
        --radius:18px;
      }

      html{
        /* ONE background owner */
        background:
        radial-gradient(
        900px 500px at 20% 10%,
        rgba(108,167,255,.10),
        transparent 60%
        ),
        radial-gradient(
        700px 420px at 85% 15%,
        rgba(125,92,255,.08),
        transparent 55%
        ),
        #070A1E; /* darker base */
        background-repeat: no-repeat;
        }

        body{
        margin:0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);

        /* IMPORTANT: don't paint another background */
        background: transparent;
        }

        .app-shell,
        main,
        .page{
        /* IMPORTANT: keep these transparent too */
        background: transparent;
        }

      *{ box-sizing:border-box; }
   
      a{ color:inherit; text-decoration:none; }

      .app-shell{
        min-height: 100vh;   /* fallback */
        min-height: 100svh;  /* mobile-correct */
        display:flex;
        flex-direction:column;
        min-height: 100vh;


        animation: pageFadeIn .35s ease-out;
        }


      /* Topbar */
      .topbar{
        position:sticky;
        top:0;
        backdrop-filter: blur(10px);
        background: rgba(7,11,26,.55);
        border-bottom:1px solid var(--border);
        z-index:20;
      }

      .topbar-inner{
        max-width:1120px;
        margin:0 auto;
        padding:14px 18px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:14px;
      }

      .brand{
        display:flex;
        align-items:center;
        gap:10px;
        font-weight:700;
      }

      .brand-logo{
        width:34px;
        height:34px;
        padding:6px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.14);
        background: rgba(234,240,255,.06);
        box-shadow: var(--shadow);
      }

      .brand small{
        display:block;
        font-weight:500;
        color:var(--muted);
        font-size:12px;
      }

      .navlinks{
        display:flex;
        gap:10px;
      }

      .navlink{
        padding:9px 12px;
        border-radius:12px;
        color:var(--muted);
        font-weight:600;
      }

      .navlink:hover,
      .navlink.is-active{
        background: rgba(234,240,255,.08);
        color:var(--text);
      }

      .user-actions{
        display:flex;
        gap:10px;
        align-items:center;
      }

      .btn{
        padding:9px 12px;
        border-radius:14px;
        border:1px solid var(--border);
        background: rgba(234,240,255,.05);
        color:var(--text);
        font-weight:700;
        cursor:pointer;
      }

      main{ flex:1; }
      .page{
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px 14px 18px;
        }

        @media (min-width: 820px){
        .page{
            padding: 22px 18px 22px;
        }
        }

    @keyframes pageFadeIn{
    from{
        opacity: 0;
        transform: translateY(4px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
    }
      footer{
        border-top:1px solid var(--border);
        background: rgba(7,11,26,.45);
      }

      .footer-inner{
        max-width:1120px;
        margin:0 auto;
        padding:16px 18px;
        display:flex;
        justify-content:space-between;
        color:var(--muted);
        font-size:13px;
      }

      .page{ padding: 18px 14px; }
        @media (min-width: 820px){
        .page{ padding: 22px 18px; }
       }

       /* --- Mobile fixes: navbar responsiveness + footer gap --- */
        @media (max-width: 720px){
        .topbar-inner{
            flex-direction:column;
            align-items:stretch;
            gap: 10px;
        }

        .brand{
            justify-content:flex-start;
        }

        .navlinks{
            width:100%;
            flex-wrap:wrap;
            gap:8px;
        }

        .navlink{
            flex: 1 1 auto;
            text-align:center;
            white-space:nowrap;
        }

        .user-actions{
            width:100%;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:10px;
        }

        main .page{
            padding-bottom: 16px; /* reduce extra bottom spacing */
        }

        .footer-inner{
            flex-direction:column;
            align-items:flex-start;
            gap:8px;
        }
        }

        /* Prevent phantom scroll space on some mobile browsers */
        html, body{
        height: 100%;
        }
        body{
        overflow-x: hidden;
        }


    </style>

    {% block head %}{% endblock %}
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="{{ url_for('v1.dashboard') }}">
            <img
              class="brand-logo"
              src="{{ url_for('v1.static', filename='allocations/img/logo.svg') }}"
              alt="UniBrain logo"
            />
            <span>
              UniBrain
              <small>Degree progress, but smart.</small>
            </span>
          </a>

          <nav class="navlinks">
            <a class="navlink {% if request.endpoint == 'v1.dashboard' %}is-active{% endif %}"
               href="{{ url_for('v1.dashboard') }}">Dashboard</a>
            <a class="navlink {% if 'allocations' in (request.endpoint or '') %}is-active{% endif %}"
               href="{{ url_for('v1.allocations_get') }}">Allocations</a>
            <a class="navlink"
               href="{{ url_for('v1.profile_edit_get') }}">Profile</a>
          </nav>

          <div class="user-actions">
            <span>{{ current_user.email }}</span>
            <form method="POST" action="{{ url_for('v1.auth.logout_post') }}">
              <button class="btn" type="submit">Log out</button>
            </form>
          </div>
        </div>
      </header>

      <main>
        <div class="page">
          {% block content %}{% endblock %}
        </div>
      </main>

      <footer>
        <div class="footer-inner">
          <div>© 2026 UniBrain</div>
          <div>Built for clarity.</div>
        </div>
      </footer>
    </div>
  </body>
</html>
